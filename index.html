<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lendo em companhia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><circle cx='50' cy='50' r='30' fill='%23f7ea00'/></svg>">
</head>
<body>

<!-- ==================== HOME ==================== -->
<section class="view is-active" data-view="home">
  <h1 class="logo" id="clubName">lendo em companhia</h1>
  <p class="subtitulo" id="subtitulo"></p>

  <div class="painel">
    <p class="painel__titulo">deixe seu comentário</p>

    <div class="painel__grid">
      <div class="capa-wrap">
        <img class="capa" id="cover" alt="" hidden>
        <div class="capa capa--fallback" id="coverFallback">
          <span id="coverTitle"></span>
          <em id="coverAuthor"></em>
        </div>
      </div>

      <div class="painel__form">
        <div class="capsel">
          <output class="capsel__valor" id="writeCapLabel">cap 1</output>
          <input type="range" class="slider" id="writeCap" min="1" value="1" step="1"
                 aria-label="capítulo em que você está">
        </div>

        <div class="ta-wrap">
          <textarea id="writeText" rows="4" placeholder="o que esse trecho te fez sentir?"></textarea>
          <span class="contador" id="counter">0/400</span>
        </div>

        <div class="assinar">
          <input type="text" id="writeName" maxlength="20" placeholder="nome" aria-label="seu nome">
          <input type="text" id="writeCity" maxlength="24" placeholder="cidade" aria-label="sua cidade">
          <button class="mini-btn" id="submitBtn">enviar</button>
        </div>
      </div>
    </div>
  </div>

  <button class="pill-btn" data-go="read">ler comentários dos leitores</button>
</section>

<!-- ==================== LEITURA ==================== -->
<section class="view" data-view="read">
  <button class="voltar" data-go="home">← voltar</button>

  <div class="barra">
    <span class="barra__txt">ler todos comentários até</span>
    <output class="capsel__valor capsel__valor--g" id="readCapLabel">cap 1</output>
    <input type="range" class="slider slider--g" id="readCap" min="1" value="1" step="1"
           aria-label="capítulo em que você está lendo">
  </div>

  <div id="feed"></div>
  <p class="fim" id="feedEnd"></p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
